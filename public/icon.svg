<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="luminaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D946EF" />
      <stop offset="50%" stop-color="#C026D3" />
      <stop offset="100%" stop-color="#7C3AED" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Fundo arredondado estilo App Icon -->
  <rect width="512" height="512" rx="128" fill="url(#luminaGrad)" />
  
  <!-- Brilho suave interno -->
  <circle cx="256" cy="180" r="140" fill="white" opacity="0.15" filter="url(#glow)" />
  
  <!-- Estrela Central Lumina ✨ -->
  <path d="M256 96 C256 180, 280 230, 376 256 C280 282, 256 332, 256 416 C256 332, 232 282, 136 256 C232 230, 256 180, 256 96 Z" fill="#FFFFFF" />
  
  <!-- Mini estrela de apoio superior direita -->
  <path d="M380 120 C380 145, 390 155, 415 160 C390 165, 380 175, 380 200 C380 175, 370 165, 345 160 C370 155, 380 145, 380 120 Z" fill="#FDF2F8" opacity="0.9" />
</svg>
